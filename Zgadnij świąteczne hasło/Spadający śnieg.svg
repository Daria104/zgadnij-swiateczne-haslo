<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    
    <radialGradient id="softFlake" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#E0F2FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    
    <g id="crystalFlake" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none">
      <line x1="0" y1="-10" x2="0" y2="10" />
      <line x1="-8.66" y1="-5" x2="8.66" y2="5" />
      <line x1="8.66" y1="-5" x2="-8.66" y2="5" />
      <polyline points="-3,-6 0,-3 3,-6" />
      <polyline points="-3,6 0,3 3,6" />
      <polyline points="-6.5,-1.5 -2.5,-1.5 -4,-5" />
      <polyline points="6.5,1.5 2.5,1.5 4,5" />
      <polyline points="6.5,-1.5 2.5,-1.5 4,-5" />
      <polyline points="-6.5,1.5 -2.5,1.5 -4,5" />
    </g>

    <style>
      .fall-slow-1 {
        animation: snowFall1 26s linear infinite;
      }
      .fall-slow-2 {
        animation: snowFall2 34s linear infinite;
      }
      .fall-slow-3 {
        animation: snowFall3 42s linear infinite;
      }
      .sway {
        animation: snowSway 9s ease-in-out infinite alternate;
      }

      @keyframes snowFall1 {
        0%   { transform: translateY(-60px); opacity: 0; }
        10%  { opacity: 0.85; }
        90%  { opacity: 0.85; }
        100% { transform: translateY(1140px); opacity: 0; }
      }

      @keyframes snowFall2 {
        0%   { transform: translateY(-60px); opacity: 0; }
        12%  { opacity: 0.65; }
        88%  { opacity: 0.65; }
        100% { transform: translateY(1140px); opacity: 0; }
      }

      @keyframes snowFall3 {
        0%   { transform: translateY(-60px); opacity: 0; }
        15%  { opacity: 0.45; }
        85%  { opacity: 0.45; }
        100% { transform: translateY(1140px); opacity: 0; }
      }

      @keyframes snowSway {
        0%   { transform: translateX(-18px) rotate(-15deg); }
        100% { transform: translateX(18px) rotate(15deg); }
      }
    </style>
  </defs>

  
  <g class="fall-slow-1" style="animation-delay: -2s;">
